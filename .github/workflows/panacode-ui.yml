name: panacode-ui

on:
  push:
    branches: ["panacode/**", "dev"]
  pull_request:
  workflow_dispatch:

jobs:
  ownership:
    name: panacode ui ownership and brand
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Ownership check
        run: bun script/panacode-ui-ownership-check.ts

      - name: User-visible brand scan
        run: bun script/panacode-brand-scan.ts
