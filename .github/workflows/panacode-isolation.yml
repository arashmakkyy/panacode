name: panacode-isolation

# Guards the Panacode/OpenCode boundary: PANACODE_* only, branded sidecars, a read-only legacy
# config allowlist, and no upstream update feed.
#
# Every test group runs through script/panacode-test-contract.ts. It fails when a listed path is
# missing, a test fails or errors, Bun prints no summary, fewer than --min-pass tests pass, more
# than --max-skip tests skip, or the group exceeds its timeout. A Windows acceptance suite that
# silently regresses to a skip therefore cannot look green.
#
# Ubuntu runs the platform-neutral ownership, config, storage, client, PTY, desktop and GUI
# contracts. windows-latest runs the real lifecycle service, NTFS junction/alias guard, live
# foreign-PID witness, foreign shell preservation, support ZIP privacy, PTY, state-root and NSIS
# installer harness. This workflow only tests and builds nothing; releases stay in
# panacode-windows.yml and publishing is never enabled here.
on:
  pull_request:
    branches: ["panacode-isolation", "panacode/redesign-v2"]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ["isolation-fixes", "panacode-isolation"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: panacode-isolation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  tool-turn:
    name: Tool calls, session recovery and rendered outcome
    # The pinned Playwright distribution ships Chromium dependencies for Ubuntu 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: PanaAI completion and rejection contracts
        run: bun script/panacode-test-contract.ts --cwd packages/ai --min-pass 50 -- ./test/provider/panaai-chat.test.ts ./test/provider-error.test.ts
      - name: Full session runner, model history and path validation
        run: bun script/panacode-test-contract.ts --cwd packages/core --min-pass 290 --test-timeout 45000 -- ./test/session-runner.test.ts ./test/session-runner-message.test.ts ./test/session-system-prompt.test.ts ./test/plugin/tool-input-repair-integration.test.ts
      - name: Install zsh for the shell registry cases
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends zsh
      - name: Run file validation and native PowerShell through the tool registry
        run: bun script/panacode-test-contract.ts --cwd packages/core --min-pass 176 --test-timeout 45000 --require-pass "recovers from a Bash heredoc in PowerShell without overwriting the actual page" -- ./test/tool-registry.test.ts ./test/tool-schema.test.ts ./test/tool-shell.test.ts
      - name: Shell argument and syntax contracts
        run: bun script/panacode-test-contract.ts --cwd packages/core --min-pass 343 --require-pass "provides a direct PowerShell command after a structural rejection" -- ./test/shell-parse.test.ts ./test/shell-scan/powershell-syntax.test.ts ./test/shell-scan/powershell-safety.test.ts
      - name: Activity and tool status
        run: bun script/panacode-test-contract.ts --cwd packages/panacode-ui --min-pass 14 --require-pass "the terminal event determines the outcome even if an earlier tool or assistant recovered" -- ./src/adapters/agent-run.test.ts ./src/adapters/tool-call.test.ts ./src/adapters/agent-orchestrator.test.ts
      - name: Install test browser
        working-directory: packages/app
        run: bun x playwright install --with-deps chromium
      - name: Render failed and recovered sessions
        working-directory: packages/app
        run: bun run test:e2e --project chromium --workers 1 --retries 0 --grep "Panacode run card reports" e2e/regression/session-timeline-reducer-projection.spec.ts
      - name: Save browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tool-turn-browser-failure
          path: packages/app/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 3

  guards:
    name: guards (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Verify pinned Bun
        run: test "$(bun --version)" = "$(node -p 'require("./package.json").packageManager.split("@")[1]')"

      - name: Test the CI runner contract
        run: bun script/panacode-test-contract.ts --cwd script --min-pass 1 -- ./panacode-test-contract.test.ts

      - name: Runtime isolation guard
        run: bun script/panacode-isolation-check.ts

      - name: UI ownership guard
        run: bun script/panacode-ui-ownership-check.ts

      - name: Brand scan
        run: bun script/panacode-brand-scan.ts

  quality:
    env:
      TURBO_TELEMETRY_DISABLED: "1"
    name: root quality (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Verify pinned Bun
        run: test "$(bun --version)" = "$(node -p 'require("./package.json").packageManager.split("@")[1]')"

      - name: Gate root lint, SDK docs and typecheck
        run: bun run check

  linux-core:
    name: linux core, desktop and gui (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Verify pinned Bun
        id: ready
        run: test "$(bun --version)" = "$(node -p 'require("./package.json").packageManager.split("@")[1]')"

      - name: Set up Node for the production SEA smoke test
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "26.4.0"

      - name: Run a real Node single-executable application
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: bun script/panacode-test-contract.ts --cwd packages/cli --min-pass 1 --test-timeout 120000 -- ./test/panacode-sea.test.ts

      - name: Product environment and global roots
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: bun script/panacode-test-contract.ts --cwd packages/util --min-pass 7 -- ./test/product-env.test.ts ./test/global-roots.test.ts

      - name: Legacy config allowlist and storage isolation
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: bun script/panacode-test-contract.ts --cwd packages/core --min-pass 58 --max-skip 1 -- ./test/config/config.test.ts ./test/config/discovery.test.ts ./test/config/watch.test.ts ./test/storage-isolation.test.ts

      - name: Persistent PTY resolver, daemon and handoff
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: bun script/panacode-test-contract.ts --cwd packages/core --min-pass 40 --max-skip 0 --test-timeout 30000 -- ./test/persistent-pty-binary.test.ts ./test/persistent-pty-daemon.test.ts ./test/persistent-pty-session.test.ts ./test/shell-daemon.test.ts

      - name: Server process identity
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: bun script/panacode-test-contract.ts --cwd packages/server --min-pass 7 -- ./test/process.test.ts ./test/service-status.test.ts

      # The product brief calls out this exact path: the old workflow pointed at
      # script/electron-builder.config.test.ts, which does not exist.
      - name: Desktop packaging identity (electron-builder.config.test.ts)
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: bun script/panacode-test-contract.ts --cwd packages/desktop --min-pass 8 -- ./electron-builder.config.test.ts

      - name: Desktop CLI staging and installer metadata
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: bun script/panacode-test-contract.ts --cwd packages/desktop --min-pass 10 -- ./electron.vite.config.test.ts ./script/utils.test.ts

      - name: Desktop identity and service contracts
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: bun script/panacode-test-contract.ts --cwd packages/desktop --min-pass 79 --max-skip 2 --require-pass "parseShellEnv reads null-delimited pairs and ignores invalid entries" -- ./src/main/service/shell-env.test.ts ./src/main/lifecycle/configure.test.ts ./src/main/service/desktop-cli-state.test.ts ./src/main/service/cli-stages.test.ts ./src/main/service/cli-service-file.test.ts ./src/main/service/sidecar-probe.test.ts ./src/main/service/cli-version.test.ts ./src/main/service/background-service-machine.test.ts ./src/main/service/state-root.test.ts ./src/main/native/logging-machine.test.ts

      - name: Support archive private-data exclusion
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: bun script/panacode-test-contract.ts --cwd packages/desktop --min-pass 18 -- ./src/main/native/support-archive.test.ts ./src/main/lifecycle/deep-link.test.ts

      # The repeatable WSL script/install path is exercised by wsl/local.test.ts. The real
      # wsl/runtime.test.ts case needs an installed WSL distribution and is tracked as a
      # separate acceptance row; GitHub-hosted Windows runners do not provide one.
      - name: SSH and WSL fixture contracts
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: bun script/panacode-test-contract.ts --cwd packages/gui-plugins --min-pass 55 --test-timeout 60000 -- ./src/managed-cli.test.ts ./src/ssh/bootstrap.test.ts ./src/ssh/remote-cli.test.ts ./src/ssh/dialog-machine.test.ts ./src/ssh/main-machine.test.ts ./src/ssh/window-machine.test.ts ./src/wsl/local.test.ts

  linux-client:
    name: linux client service contracts (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Verify pinned Bun
        id: ready
        run: test "$(bun --version)" = "$(node -p 'require("./package.json").packageManager.split("@")[1]')"

      - name: Client registration, control channel and recovery
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        timeout-minutes: 20
        run: bun script/panacode-test-contract.ts --cwd packages/client --min-pass 90 --max-skip 0 --test-timeout 30000 --timeout-ms 900000 -- ./test/service-probe.test.ts ./test/service-decision.test.ts ./test/service-control.test.ts ./test/service-file.test.ts ./test/service-reconnect.test.ts ./test/service-witness.test.ts ./test/service.test.ts ./test/promise-service.test.ts ./test/service-contender-pool.test.ts

  linux-cli:
    name: linux cli contracts (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Verify pinned Bun
        id: ready
        run: test "$(bun --version)" = "$(node -p 'require("./package.json").packageManager.split("@")[1]')"

      - name: CLI ownership, shell preservation and manual updates
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: bun script/panacode-test-contract.ts --cwd packages/cli --min-pass 55 --max-skip 1 --test-timeout 30000 -- ./test/updater-isolation.test.ts ./test/env.test.ts ./test/shell-config.test.ts ./test/install-shell.test.ts ./test/uninstall.test.ts ./test/service-witness.test.ts

      - name: Database path foreign-root and alias guard
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: bun script/panacode-test-contract.ts --cwd packages/cli --min-pass 18 --max-skip 2 --test-timeout 30000 --require-pass "the real server refuses a foreign PANACODE_DB before writing" -- ./test/database-path.test.ts

      - name: Real service lifecycle
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        timeout-minutes: 20
        run: bun script/panacode-test-contract.ts --cwd packages/cli --min-pass 8 --max-skip 0 --test-timeout 120000 --timeout-ms 900000 --require-pass "concurrent CLI and client starts converge on one server" --require-pass "status without a running service prints stopped and private mode prints no credentials" -- ./test/service-lifecycle.test.ts

      - name: Service, debug and upgrade contracts
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        timeout-minutes: 20
        run: bun script/panacode-test-contract.ts --cwd packages/cli --min-pass 50 --max-skip 3 --test-timeout 30000 --timeout-ms 900000 -- ./test/service.test.ts ./test/server-connection.test.ts ./test/debug-config.test.ts ./test/debug-heap-dump.test.ts ./test/upgrade.test.ts

  windows-acceptance:
    name: windows acceptance (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Verify pinned Bun
        id: ready
        run: test "$(bun --version)" = "$(node -p 'require("./package.json").packageManager.split("@")[1]')"

      # Detached service fixture: the suite observes processes through
      # Get-CimInstance Win32_Process with the fixture's exact entry path and creation time,
      # and disposal only signals processes that still match both.
      - name: Real service lifecycle (Windows service processes)
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        timeout-minutes: 20
        run: bun script/panacode-test-contract.ts --cwd packages/cli --min-pass 8 --max-skip 0 --test-timeout 120000 --timeout-ms 900000 --require-pass "concurrent CLI and client starts converge on one server" --require-pass "status without a running service prints stopped and private mode prints no credentials" -- ./test/service-lifecycle.test.ts

      - name: Database path junction, alias and sidecar guard
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: bun script/panacode-test-contract.ts --cwd packages/cli --min-pass 19 --max-skip 1 --test-timeout 30000 --require-pass "the real server refuses a foreign PANACODE_DB before writing" -- ./test/database-path.test.ts

      - name: Live foreign PID and PTY witness
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: bun script/panacode-test-contract.ts --cwd packages/cli --min-pass 2 --max-skip 0 -- ./test/service-witness.test.ts

      - name: Foreign shell profile preservation
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: bun script/panacode-test-contract.ts --cwd packages/cli --min-pass 5 --max-skip 0 -- ./test/uninstall.test.ts

      - name: Shell installer block and cleanup contract
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: bun script/panacode-test-contract.ts --cwd packages/cli --min-pass 36 --max-skip 1 -- ./test/shell-config.test.ts ./test/install-shell.test.ts

      - name: Service, updater and environment contracts
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        timeout-minutes: 20
        run: bun script/panacode-test-contract.ts --cwd packages/cli --min-pass 60 --max-skip 3 --test-timeout 30000 --timeout-ms 900000 --require-pass "registers upgrade in root help" --require-pass "documents upgrade options in command help" -- ./test/service.test.ts ./test/server-connection.test.ts ./test/debug-config.test.ts ./test/debug-heap-dump.test.ts ./test/upgrade.test.ts ./test/updater-isolation.test.ts ./test/env.test.ts

      - name: Support ZIP private-data exclusion
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: bun script/panacode-test-contract.ts --cwd packages/desktop --min-pass 18 --max-skip 0 -- ./src/main/native/support-archive.test.ts ./src/main/lifecycle/deep-link.test.ts

      - name: Persistent PTY resolver, digest and handoff
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: bun script/panacode-test-contract.ts --cwd packages/core --min-pass 40 --max-skip 2 --test-timeout 30000 -- ./test/persistent-pty-binary.test.ts ./test/persistent-pty-daemon.test.ts ./test/persistent-pty-session.test.ts ./test/shell-daemon.test.ts

      - name: Desktop packaging identity (electron-builder.config.test.ts)
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: bun script/panacode-test-contract.ts --cwd packages/desktop --min-pass 8 -- ./electron-builder.config.test.ts

      - name: Desktop CLI staging and installer metadata
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: bun script/panacode-test-contract.ts --cwd packages/desktop --min-pass 10 -- ./electron.vite.config.test.ts ./script/utils.test.ts

      - name: Desktop identity, state root and service contracts
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: bun script/panacode-test-contract.ts --cwd packages/desktop --min-pass 78 --max-skip 1 --require-pass "parseShellEnv reads null-delimited pairs and ignores invalid entries" -- ./src/main/service/shell-env.test.ts ./src/main/lifecycle/configure.test.ts ./src/main/service/desktop-cli-state.test.ts ./src/main/service/cli-stages.test.ts ./src/main/service/cli-service-file.test.ts ./src/main/service/sidecar-probe.test.ts ./src/main/service/cli-version.test.ts ./src/main/service/background-service-machine.test.ts ./src/main/service/state-root.test.ts ./src/main/native/logging-machine.test.ts

      # This step runs alone: the client recovery fixtures use short control-channel and
      # contender deadlines, and CPU contention from another suite makes them flaky.
      - name: Client registration, control channel and recovery
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        timeout-minutes: 20
        run: bun script/panacode-test-contract.ts --cwd packages/client --min-pass 88 --max-skip 2 --test-timeout 30000 --timeout-ms 900000 -- ./test/service-probe.test.ts ./test/service-decision.test.ts ./test/service-control.test.ts ./test/service-file.test.ts ./test/service-reconnect.test.ts ./test/service-witness.test.ts ./test/service.test.ts ./test/promise-service.test.ts ./test/service-contender-pool.test.ts

      # Real-WSL execution is a separate acceptance row; the repeatable WSL script/install
      # path runs through wsl/local.test.ts with Git Bash.
      - name: SSH and WSL fixture contracts
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: bun script/panacode-test-contract.ts --cwd packages/gui-plugins --min-pass 55 --test-timeout 60000 -- ./src/managed-cli.test.ts ./src/ssh/bootstrap.test.ts ./src/ssh/remote-cli.test.ts ./src/ssh/dialog-machine.test.ts ./src/ssh/main-machine.test.ts ./src/ssh/window-machine.test.ts ./src/wsl/local.test.ts

  nsis:
    name: Native Windows installer contracts
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Verify pinned Bun
        run: test "$(bun --version)" = "$(node -p 'require("./package.json").packageManager.split("@")[1]')"

      # Real makensis, plugins, 7za and the production installer include. This is the NSIS
      # executable harness, not a metadata-only test.
      - name: NSIS installer executable harness
        timeout-minutes: 30
        run: bun script/panacode-test-contract.ts --cwd packages/desktop --min-pass 8 --max-skip 0 --test-timeout 600000 --timeout-ms 1800000 -- ./script/windows-installer.test.ts
